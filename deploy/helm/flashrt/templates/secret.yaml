{{- if .Values.secrets.hfToken.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flashrt.fullname" . }}-hf-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flashrt.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ .Values.secrets.hfToken.token | b64enc | quote }}
{{- end }}

{{- if .Values.secrets.apiKeys.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flashrt.fullname" . }}-api-keys
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flashrt.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $index, $key := .Values.secrets.apiKeys.keys }}
  key-{{ $index }}: {{ $key | b64enc | quote }}
  {{- end }}
{{- end }}