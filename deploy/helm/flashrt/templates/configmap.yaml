apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flashrt.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flashrt.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  FLASHRT_SM_VERSION: {{ .Values.gpu.smVersion | quote }}
  {{- if .Values.configMaps.flashrtConfig }}
  config.yaml: |
{{ .Values.configMaps.flashrtConfig.data.config.yaml | indent 4 }}
  {{- end }}